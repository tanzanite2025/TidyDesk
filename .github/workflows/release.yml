name: Release desktop & mobile sync bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, for example v0.0.2'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer & Sync/Mobile PWA bundle
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      TAURI_TARGET_TRIPLE: x86_64-pc-windows-msvc

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust MSVC toolchain
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run tauri:verify-version

      - name: Generate release notes for updater manifest
        shell: pwsh
        run: |
          $currentTag = $env:RELEASE_TAG
          $prevTag = $null
          $rawPrev = $null
          try {
            $rawPrev = git describe --tags --abbrev=0 --match "v*" "$currentTag^" 2>$null
            if ($LASTEXITCODE -eq 0 -and $rawPrev) {
              $prevTag = "$rawPrev".Trim()
            }
          } catch {
            $prevTag = $null
          }
          $global:LASTEXITCODE = 0
          $range = if ($prevTag) { "$prevTag..$currentTag" } else { $currentTag }
          $lines = @()
          try {
            $rawLines = @(git log $range --no-merges --max-count=20 --pretty=format:"- %s" 2>$null)
            if ($LASTEXITCODE -eq 0) {
              $lines = $rawLines | Where-Object { $_ -and "$_".Trim() }
            }
          } catch {
            $lines = @()
          }
          $global:LASTEXITCODE = 0
          $notes = if ($lines.Count -gt 0) {
            ($lines -join "`n").Trim()
          } else {
            "- TidyDesk $currentTag 桌面端与同步服务端/移动端 PWA 更新"
          }
          $delimiter = "TIDYDESK_NOTES_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_ENV -Value "TIDYDESK_UPDATER_NOTES<<$delimiter"
          Add-Content -Path $env:GITHUB_ENV -Value $notes
          Add-Content -Path $env:GITHUB_ENV -Value $delimiter

      - name: Run web & TypeScript checks
        run: |
          npm run test:web
          npx tsc --noEmit --noUnusedLocals --noUnusedParameters
          npm run check

      - name: Run sync server & release script tests
        run: node --test server/test/sync.test.mjs server/test/phase2_pg_minio.test.mjs scripts/test-release-scripts.mjs

      - name: Run Rust Clippy & tests
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build signed desktop updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:release

      - name: Package sync server + mobile PWA bundle
        run: npm run server:package

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          make_latest: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            release-tauri/latest.json
            release-server/*.zip
